<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Sets · SoundCloud</title>
<script src="https://w.soundcloud.com/player/api.js"></script>
<style>
  :root{
    --bg:#0e0e10; --fg:#e9e9ec; --dim:#8a8a92; --card:#17171b;
    --border:#26262c; --acc:#f26f21; --acc2:#4ea1ff; --ok:#3ecf8e; --no:#e05a5a; --mark:#f2c14e;
    --btn:#22222a; --btn-hover:#2c2c36;
    --player-h:64px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
    font:15px/1.4 -apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;
    -webkit-tap-highlight-color:transparent;overscroll-behavior:none}

  header{position:fixed;top:0;left:0;right:0;background:var(--bg);z-index:10;
    padding:env(safe-area-inset-top) 14px 0;border-bottom:1px solid var(--border)}
  .head-row{display:flex;align-items:baseline;gap:10px;padding:12px 0 10px}
  .head-row h1{font-size:17px;font-weight:700;margin:0;letter-spacing:.2px}
  .head-row .sub{font-size:12px;color:var(--dim);margin-left:auto;
    font-variant-numeric:tabular-nums;white-space:nowrap}
  .head-row .sub.err{color:var(--no)}
  .head-row .ver{font-size:10px;color:var(--dim);opacity:.6;white-space:nowrap;
    font-variant-numeric:tabular-nums;letter-spacing:.3px}
  .pl-row{padding:0 0 10px}
  .pl-select{width:100%;padding:8px 10px;background:var(--btn);color:var(--fg);
    border:1px solid var(--border);border-radius:8px;font-size:13px;font-weight:600;
    -webkit-appearance:none;appearance:none}

  .filters{display:flex;gap:7px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;padding:7px 12px;background:var(--btn);border:1px solid var(--border);
    border-radius:16px;color:var(--fg);font-size:13px;font-weight:600;cursor:pointer;
    white-space:nowrap;transition:background .15s ease,border-color .15s ease,color .15s ease}
  .chip:active{background:var(--btn-hover)}
  .chip.active{background:var(--acc);border-color:var(--acc);color:#fff}
  .chip .n{opacity:.7;font-weight:600;margin-left:3px}
  .chip.active .n{opacity:.9}

  .list{padding:14px 12px calc(var(--player-h) + 28px);padding-top:var(--header-h,64px)}

  .card{display:flex;align-items:center;gap:12px;background:var(--card);
    border:1px solid var(--border);border-radius:14px;padding:10px;margin-bottom:10px;
    transition:border-color .2s ease,background .12s ease;cursor:pointer}
  .card:active{background:var(--btn-hover)}
  .card.playing{border-color:var(--acc)}
  .card.done{opacity:.72}
  .art{flex:0 0 auto;width:60px;height:60px;border-radius:10px;object-fit:cover;
    background:linear-gradient(135deg,#2a2a34,#1a1a20);display:flex;
    align-items:center;justify-content:center;font-size:22px;color:var(--dim);
    overflow:hidden;position:relative}
  .art img{width:100%;height:100%;object-fit:cover;display:block}
  .cbody{flex:1 1 auto;min-width:0}
  .ctitle{font-size:15px;font-weight:600;line-height:1.3;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .cartist{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;margin-top:2px}
  .cprog{margin-top:8px}
  .cbar{height:4px;background:var(--border);border-radius:2px;overflow:hidden}
  .cfill{height:100%;width:0;background:var(--acc);border-radius:2px}
  .card.done .cfill{background:var(--ok)}
  .ctime{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);
    margin-top:4px;font-variant-numeric:tabular-nums}
  .ctime .done-tag{color:var(--ok);font-weight:600}
  .cplay{flex:0 0 auto;width:44px;height:44px;border-radius:50%;
    background:var(--acc);border:0;color:#fff;font-size:16px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:transform .1s ease}
  .cplay:active{transform:scale(.93)}
  .cplay.ghost{background:var(--btn);border:1px solid var(--border);color:var(--fg)}

  .empty{padding:48px 20px;text-align:center;color:var(--dim);line-height:1.6}
  .spinner{display:inline-block;width:20px;height:20px;border:2px solid var(--border);
    border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite;
    vertical-align:-4px;margin-right:8px}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---- Reproductor (mini barra + panel expandido) ---- */
  .player{position:fixed;left:0;right:0;bottom:0;z-index:30;pointer-events:none}
  .player > *{pointer-events:auto}

  .pl-progress{height:3px;background:var(--border);position:relative;z-index:2;
    transform:translateY(140%);transition:transform .3s ease}
  .player.visible .pl-progress{transform:translateY(0)}
  .player.open .pl-progress{opacity:0}
  .pl-fill{height:100%;width:0;background:var(--acc);transition:width .25s linear}

  .pl-mini{display:flex;align-items:center;gap:12px;background:var(--card);
    border-top:1px solid var(--border);
    padding:9px 14px calc(9px + env(safe-area-inset-bottom));
    box-shadow:0 -4px 20px rgba(0,0,0,.45);position:relative;z-index:2;
    transform:translateY(140%);transition:transform .3s ease}
  .player.visible .pl-mini{transform:translateY(0)}
  .player.open .pl-mini{transform:translateY(140%)}
  .pl-mini-art{flex:0 0 auto;width:40px;height:40px;border-radius:8px;object-fit:cover;
    background:#26262c;overflow:hidden}
  .pl-mini-art img{width:100%;height:100%;object-fit:cover;display:block}
  .pl-info{flex:1 1 auto;min-width:0;cursor:pointer}
  .pl-t{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pl-a{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pl-round{flex:0 0 auto;width:42px;height:42px;border-radius:50%;
    background:var(--acc);border:0;color:#fff;font-size:16px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:transform .1s ease}
  .pl-round:active{transform:scale(.93)}
  .pl-round.ghost{background:var(--btn);border:1px solid var(--border);color:var(--fg)}

  .pl-full{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) 20px calc(20px + env(safe-area-inset-bottom));
    transform:translateY(100%);transition:transform .3s ease;z-index:40}
  .player.open .pl-full{transform:translateY(0)}
  .pl-full-head{display:flex;justify-content:center;padding:10px 0 4px}
  .pl-collapse{background:none;border:0;color:var(--fg);font-size:30px;cursor:pointer;
    padding:4px 50px;line-height:1}
  .pl-full-body{flex:1 1 auto;display:flex;flex-direction:column;justify-content:flex-start;
    max-width:520px;width:100%;margin:0 auto;overflow:hidden;padding:6px 2px 0;min-height:0}
  .pl-fixed{flex:0 0 auto;display:flex;flex-direction:column;gap:14px}
  .pl-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:4px 0 calc(20px + env(safe-area-inset-bottom))}
  .tl-head{border-top:1px solid var(--border);padding-top:12px;margin-bottom:0}
  .pl-big-art{width:100%;max-width:180px;aspect-ratio:1;margin:2px auto 0;border-radius:16px;
    background:linear-gradient(135deg,#2a2a34,#1a1a20);overflow:hidden;
    box-shadow:0 12px 40px rgba(0,0,0,.5)}
  .pl-big-art img{width:100%;height:100%;object-fit:cover;display:block}
  .pl-full-title{font-size:22px;font-weight:700;line-height:1.25;text-align:center}
  .pl-full-artist{font-size:14px;color:var(--dim);text-align:center;margin-top:-8px}
  .pl-bar-wrap{cursor:default}
  .pl-bar{height:5px;background:var(--border);border-radius:3px;overflow:hidden}
  .pl-bar-fill{height:100%;width:0;background:var(--acc);border-radius:3px}
  .pl-times{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);
    margin-top:6px;font-variant-numeric:tabular-nums}
  .pl-row{display:flex;gap:10px;justify-content:center;align-items:center}
  .pl-nav{width:56px;height:56px;border-radius:50%;background:var(--btn);
    border:1px solid var(--border);color:var(--fg);font-size:18px;cursor:pointer;
    display:flex;align-items:center;justify-content:center}
  .pl-nav.main{width:70px;height:70px;background:var(--acc);border-color:var(--acc);
    color:#fff;font-size:24px}
  .pl-nav svg{width:24px;height:24px;fill:currentColor;display:block}
  .pl-nav.main svg{width:30px;height:30px}
  .pl-round svg{width:19px;height:19px;fill:currentColor;display:block}
  .cplay svg{width:19px;height:19px;fill:currentColor;display:block}
  .pl-nav:active{transform:scale(.94)}
  .seek-row{display:flex;gap:10px}
  .seek{flex:1;padding:14px 6px;background:var(--btn);border:1px solid var(--acc);
    border-radius:12px;color:var(--acc);font-weight:700;font-size:15px;cursor:pointer}
  .seek:active{background:var(--btn-hover)}
  .seek.back{color:var(--acc2);border-color:var(--acc2)}
  .pl-foot{display:flex;justify-content:center;gap:34px;margin-top:2px}
  .pl-foot .fbtn{background:none;border:0;cursor:pointer;padding:2px;display:flex;
    flex-direction:column;align-items:center;gap:5px}
  .pl-foot .fbtn .ic{width:48px;height:48px;border-radius:50%;background:var(--btn);
    border:1px solid var(--border);display:flex;align-items:center;justify-content:center;
    font-size:22px;color:var(--fg);transition:transform .1s ease,background .12s ease}
  .pl-foot .fbtn:active .ic{transform:scale(.92);background:var(--btn-hover)}
  .pl-foot .fbtn .cap{font-size:11px;color:var(--dim)}
  .pl-foot .fbtn.mark .ic{color:var(--acc);border-color:var(--acc)}
  .pl-foot .fbtn.done .ic{background:var(--ok);border-color:var(--ok);color:#0e0e10}
  .pl-foot .fbtn.done .cap{color:var(--ok)}

  /* ---- Secciones de Marcas y Tracklist ---- */
  .sect{border-top:1px solid var(--border);padding-top:12px;margin-top:2px}
  .sect-head{display:flex;align-items:center;justify-content:space-between;
    font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;
    font-weight:700;margin-bottom:8px}
  .sect-head .add{background:var(--btn);border:1px solid var(--acc);color:var(--acc);
    font-size:12px;font-weight:700;border-radius:8px;padding:5px 10px;cursor:pointer;
    text-transform:none;letter-spacing:0}
  .sect-head .add:active{background:var(--btn-hover)}

  .mk{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-bottom:1px solid #1e1e24}
  .mk:last-child{border-bottom:0}
  .mk-t{flex:0 0 auto;background:var(--btn);border:1px solid var(--border);color:var(--acc);
    font-size:12px;font-weight:700;border-radius:6px;padding:4px 8px;cursor:pointer;
    font-variant-numeric:tabular-nums;line-height:1.2}
  .mk-t:active{background:var(--btn-hover)}
  .mk-note{flex:1 1 auto;min-width:0;font-size:13px;line-height:1.35;word-break:break-word;
    padding-top:3px}
  .mk-x{flex:0 0 auto;background:none;border:0;color:var(--dim);font-size:14px;cursor:pointer;
    padding:4px 2px;line-height:1}
  .mk-x:active{color:var(--no)}
  .sect-empty{color:var(--dim);font-size:12px;padding:2px 0 4px}

  .tl-src{font-size:11px;color:var(--dim);margin-bottom:8px;word-break:break-all}
  .tl-src a{color:var(--acc2)}
  .tk{display:flex;align-items:baseline;gap:10px;padding:6px 0;border-bottom:1px solid #1e1e24;
    font-size:13px;line-height:1.35}
  .tk:last-child{border-bottom:0}
  .tk-t{flex:0 0 auto;color:var(--acc);font-weight:700;font-variant-numeric:tabular-nums;
    cursor:pointer;min-width:52px}
  .tk-t:active{opacity:.7}
  .tk-name{flex:1 1 auto;min-width:0}
  .tk-name .art{color:var(--fg);font-weight:600;background:none;width:auto;height:auto;display:inline}
  .tk-plays{color:var(--dim);font-size:11px;margin-left:8px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .tk-edit{flex:0 0 auto;background:none;border:0;color:var(--dim);cursor:pointer;font-size:14px;padding:2px 4px;line-height:1}
  .tk-edit:active{color:var(--acc2)}
  .tk-empty .tk-name{color:var(--dim);font-style:italic}
  .tk-user .tk-name{color:var(--fg)}
  .tk-note{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 8px 62px}
  .tk-note input{flex:1 1 120px;min-width:0;background:var(--btn);border:1px solid var(--border);
    border-radius:8px;color:var(--fg);font-size:13px;padding:8px 9px;outline:none}
  .tk-note input:focus{border-color:var(--acc2)}
  .tk-note button{flex:0 0 auto;background:var(--acc2);border:0;color:#fff;font-weight:700;
    border-radius:8px;padding:8px 12px;cursor:pointer;font-size:12px}
  .tk-note button.ghost{background:var(--btn);color:var(--fg);border:1px solid var(--border);font-weight:600}
  .tid-form{display:flex;gap:8px;margin-top:6px}
  .tid-form input{flex:1 1 auto;min-width:0;background:var(--btn);border:1px solid var(--border);
    border-radius:8px;color:var(--fg);font-size:13px;padding:9px 10px;outline:none}
  .tid-form input:focus{border-color:var(--acc2)}
  .tid-form button{flex:0 0 auto;background:var(--acc2);border:0;color:#fff;font-weight:700;
    border-radius:8px;padding:9px 14px;cursor:pointer;font-size:13px}
  .tid-open{display:inline-block;margin-top:8px;color:var(--acc2);font-size:13px}

  /* Pegar tracklist (trackid.net u otra fuente) */
  .tl-paste{margin-top:10px}
  .tl-paste textarea{width:100%;box-sizing:border-box;min-height:90px;resize:vertical;
    background:var(--btn);border:1px solid var(--border);border-radius:8px;color:var(--fg);
    font-size:13px;line-height:1.4;padding:9px 10px;outline:none;font-family:inherit}
  .tl-paste textarea:focus{border-color:var(--acc2)}
  .tl-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
  .tl-actions button{flex:0 0 auto;background:var(--acc2);border:0;color:#fff;font-weight:700;
    border-radius:8px;padding:9px 14px;cursor:pointer;font-size:13px}
  .tl-actions button.ghost{background:var(--btn);color:var(--fg);border:1px solid var(--border);font-weight:600}
  .tl-err{color:var(--no);font-size:12px;margin-top:6px;min-height:0}
  .tl-hint{color:var(--dim);font-size:11px;margin-top:6px;line-height:1.4}
  .tl-foot{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;padding-top:8px;border-top:1px solid #1e1e24}
  .tl-foot button{background:none;border:0;color:var(--acc2);font-size:12px;cursor:pointer;padding:2px 0}
  .tl-foot button.danger{color:var(--no)}

  /* Contadores en las cards */
  .cbadges{display:flex;gap:8px;margin-top:6px;font-size:11px;color:var(--dim);
    font-variant-numeric:tabular-nums}
  .cbadges span:empty{display:none}

  /* iframe del widget, oculto pero presente (display:none suspende el audio en iOS) */
  .pl-frame{position:absolute;bottom:0;left:0;width:1px;height:1px;overflow:hidden;
    opacity:.01;pointer-events:none}
  .pl-frame iframe{width:300px;height:120px;border:0}

  /* ---- Timeline unificado (v1.7): rangos inicio–fin, bloques sin id, marcas inline ---- */
  .tk{cursor:pointer}
  .tk:active{background:#131317}
  .tk-t{min-width:auto;white-space:nowrap}
  .tk-t .end{color:var(--dim);font-weight:600}
  .tk-dur{color:var(--dim);font-size:11px;margin-left:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .gapline{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #1e1e24;
    font-size:12px;color:var(--dim);cursor:pointer}
  .gapline:last-child{border-bottom:0}
  .gapline:active{background:#131317}
  .gapline .g-t{flex:0 0 auto;color:#7a7a82;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
  .gapline .g-lbl{flex:1 1 auto;min-width:0;font-style:italic;display:flex;align-items:center;gap:7px}
  .gapline .dot{width:6px;height:6px;border-radius:50%;background:#4a4a52;flex:0 0 auto}
  .gapline .tk-edit{font-style:normal}
  .mk-inline{display:flex;align-items:flex-start;gap:9px;padding:7px 0;cursor:pointer;
    border-bottom:1px solid #1e1e24;font-size:13px;line-height:1.35}
  .mk-inline:last-child{border-bottom:0}
  .mk-inline:active{background:#131317}
  .mk-time{flex:0 0 auto;background:rgba(242,193,78,.12);border:1px solid rgba(242,193,78,.4);
    color:var(--mark);font-size:11px;font-weight:700;border-radius:6px;padding:3px 7px;
    font-variant-numeric:tabular-nums;line-height:1.2;white-space:nowrap}
  .mk-note{flex:1 1 auto;min-width:0;word-break:break-word;padding-top:2px}
  .mk-pin{color:var(--mark);margin-right:5px}

  /* ---- v1.11: atributos por track (estrellas + tags) + marcas más indentadas ---- */
  /* Marca manual: se indenta y lleva una guía a la izquierda para que se vea que cuelga del track */
  .mk-inline{padding-left:24px;position:relative}
  .mk-inline::before{content:"";position:absolute;left:9px;top:9px;bottom:9px;width:2px;
    background:rgba(242,193,78,.4);border-radius:1px}
  /* Atributos en la columna del tiempo (debajo del rango), para no crecer la fila */
  .tk{align-items:flex-start}
  .tk-left{flex:0 1 auto;min-width:0;max-width:56%;display:flex;flex-direction:column;gap:4px}
  .tk-left .tk-t{white-space:nowrap}
  .tk-tags{display:flex;flex-wrap:wrap;gap:5px 6px;align-items:center;margin-top:0}
  .tk-stars{color:var(--mark);font-size:12px;letter-spacing:1px;line-height:1}
  .tk-chip{background:var(--btn);border:1px solid var(--border);border-radius:6px;padding:1px 7px;
    font-size:11px;color:var(--fg);white-space:nowrap}
  .tk-chip.atr{border-color:var(--acc);color:var(--acc)}
  .tk-tag{flex:0 0 auto;background:none;border:0;color:#55555e;cursor:pointer;font-size:15px;
    padding:2px 4px;line-height:1;filter:grayscale(1);opacity:.6}
  .tk-tag.on{filter:none;opacity:1}
  .tk-tag:active{transform:scale(.9)}

  /* Modal de tags (bottom-sheet) */
  .tagmodal{position:fixed;inset:0;z-index:60;display:none}
  .tagmodal.open{display:block}
  .tagmodal-bg{position:absolute;inset:0;background:rgba(0,0,0,.6)}
  .tagmodal-sheet{position:absolute;left:0;right:0;bottom:0;max-height:90%;display:flex;flex-direction:column;
    background:var(--card);border-top-left-radius:18px;border-top-right-radius:18px;border-top:1px solid var(--border);
    box-shadow:0 -8px 30px rgba(0,0,0,.55);max-width:520px;margin:0 auto}
  .tagmodal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;
    border-bottom:1px solid var(--border);flex:0 0 auto}
  .tagmodal-head .t{font-size:15px;font-weight:700}
  .tagmodal-head .x{background:none;border:0;color:var(--dim);font-size:24px;cursor:pointer;line-height:1;padding:0 6px}
  .tagmodal-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
  .tm-track{padding:9px 16px;color:var(--dim);font-size:12.5px;border-bottom:1px solid var(--border);
    font-variant-numeric:tabular-nums}
  .tm-sect{padding:13px 16px 4px;font-size:11px;color:var(--dim);text-transform:uppercase;
    letter-spacing:.06em;font-weight:700}
  .tm-stars{display:flex;gap:10px;padding:4px 16px 8px;font-size:28px;color:#3a3a42;line-height:1}
  .tm-star{cursor:pointer}
  .tm-star.on{color:var(--mark)}
  .tm-opt{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;border-bottom:1px solid #1e1e24}
  .tm-opt:active{background:var(--btn)}
  .tm-radio{flex:0 0 auto;width:20px;height:20px;border-radius:50%;border:2px solid var(--acc2);position:relative}
  .tm-opt.on .tm-radio::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--acc2)}
  .tm-lbl{flex:1 1 auto;font-size:15px}
  .tm-div{height:1px;background:var(--border);margin:3px 16px}
</style>
</head>
<body>

<header>
  <div class="head-row">
    <h1>Sets</h1>
    <span class="sub" id="sub"></span>
    <span class="ver" id="ver"></span>
  </div>
  <div class="pl-row"><select id="selPlaylist" class="pl-select" aria-label="Playlist"></select></div>
  <div class="filters" id="filters">
    <button class="chip active" data-filter="all">Todos<span class="n" data-n="all"></span></button>

<script>
// ============================================================
// CONFIG
// ============================================================
const APP_VERSION = '1.14';
// Íconos SVG (se ven igual en Chrome y en iOS; los glifos unicode se renderizaban como emoji)
const IC_PLAY  = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
const IC_PAUSE = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
const IC_PREV  = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="6" width="2.4" height="12" rx="1"/><path d="M20 6v12L9.5 12z"/></svg>';
const IC_NEXT  = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="16.6" y="6" width="2.4" height="12" rx="1"/><path d="M4 6v12l10.5-6z"/></svg>';
// Playlists públicas navegables (editar aquí para agregar/quitar una)
const PLAYLISTS = [
  { name: 'app_list',            url: 'https://soundcloud.com/alejandro_ventura/sets/app_list' },
  { name: 'DJ · Mia Lafontaine', url: 'https://soundcloud.com/alejandro_ventura/sets/dj-mia-lafontaine' },
  { name: 'DJ · KALEA',          url: 'https://soundcloud.com/alejandro_ventura/sets/dj-kalea' },
  { name: 'DJ · ANSTASCIA',      url: 'https://soundcloud.com/alejandro_ventura/sets/dj-anstascia' },
  { name: 'DJ · Romain Garcia',  url: 'https://soundcloud.com/alejandro_ventura/sets/dj-romain-garcia' },
  { name: 'DJ · Rampue',         url: 'https://soundcloud.com/alejandro_ventura/sets/dj-rampue' },
  { name: 'DJ · Mess',           url: 'https://soundcloud.com/alejandro_ventura/sets/dj-mess' },
  { name: 'DJ · GALLiVANTER',    url: 'https://soundcloud.com/alejandro_ventura/sets/dj-gallivanter' },
  { name: 'DJ · Goldcap',        url: 'https://soundcloud.com/alejandro_ventura/sets/dj-goldcap' },
  { name: 'DJ · Diass',          url: 'https://soundcloud.com/alejandro_ventura/sets/dj-diass' },

];
const LS_PL = 'sc_sets_playlist_v1';   // última playlist elegida
let PLAYLIST_URL = (function(){
  try { const sv = localStorage.getItem(LS_PL); if (sv && PLAYLISTS.some(p => p.url === sv)) return sv; } catch(e){}
  return PLAYLISTS[0].url;
})();
const LS_POS  = 'sc_sets_pos_v1';   // { <setUrl>: {pos,dur,done,at} }
const LS_LAST = 'sc_sets_last_v1';  // último set abierto (url)
const LS_MARKS = 'sc_sets_marks_v1'; // { <setUrl>: [ {t, note} ] }  marcas manuales
const LS_TID   = 'sc_sets_trackid_v1'; // { <setUrl>: trackidUrl }   link de trackid por set
const LS_LOCAL_TL = 'sc_sets_tl_local_v1'; // { <setUrl>: {source,tracks:[{t,artist,title,empty,plays}],at} } pegados en el dispositivo
const LS_TLNOTES  = 'sc_sets_tlnotes_v1';  // { <setUrl>: { <tMs>: {artist,title} } } notas manuales de track
const LS_TRACKATTRS = 'sc_sets_trackattrs_v1'; // { <setUrl>: { <trackKey>: {stars,gen,niv,atr,artist,title,t,at} } } atributos por track
const TAGS_URL = 'tags.json?t=' + Date.now();  // vocabulario de tags (editable, sin tocar el código)
const TAGS_URL_FALLBACK = 'https://aleventura.github.io/sets/tags.json?t=' + Date.now();
const LS_FILTER = 'sc_sets_filter_v1'; // filtro activo: all|new|progress|done
const PROGRESS_MIN_MS = 3000;          // umbral para considerar un set "en proceso"
// Tracklists incrustados. Se buscan como archivo local (mismo folder) y, si no,
// en la URL de producción. Formato: { <setUrl>: {source, tracks:[{t,artist,title}]} }
const TRACKLISTS_URL = 'tracklists.json?t=' + Date.now();
const TRACKLISTS_URL_FALLBACK = 'https://aleventura.github.io/sets/tracklists.json?t=' + Date.now();
const SAVE_EVERY_MS = 2500;         // cada cuánto persistir posición mientras suena
const DONE_RATIO = 0.97;            // % a partir del cual un set se marca "escuchado"

// ============================================================
// STATE
// ============================================================
let SETS = [];                       // {url,title,artist,dur,art}
let pos = JSON.parse(localStorage.getItem(LS_POS) || '{}');
let marks = JSON.parse(localStorage.getItem(LS_MARKS) || '{}');   // marcas manuales por set
let tidUrls = JSON.parse(localStorage.getItem(LS_TID) || '{}');   // link de trackid por set
let LOCAL_TL = JSON.parse(localStorage.getItem(LS_LOCAL_TL) || '{}'); // tracklists pegadas en este dispositivo
let TLNOTES  = JSON.parse(localStorage.getItem(LS_TLNOTES) || '{}');  // notas manuales de track por set
let TRACKATTRS = JSON.parse(localStorage.getItem(LS_TRACKATTRS) || '{}'); // atributos por track (estrellas + tags), por ocurrencia set+track
let TAGVOCAB = { categories: [
  {id:'gen',label:'Genero',values:['22*Pist','23*Pist','33*Pist','34*Pist','44*Pist','45*Pist','53*Pist','52*Pist','22*Viaj','33*Viaj','44*Viaj','45*Viaj','53*Viaj','52*Viaj','51*Viaj','44*Sail','53*Sail','52*Sail','51*Sail']},
  {id:'niv',label:'Nivel',values:['Afro','Bailable','Dance','Deep','Down','Funky','Hap','Indie','Melod','Music','Org','Peak','Tech']},
  {id:'atr',label:'Atributo',values:['pop','voc','sub','peak','after-peak']}
]}; // fallback embebido; tags.json (si existe) lo sobreescribe
let tagModalCtx = null;              // {url,key,tr,i} del track abierto en el modal de tags
let tlEditRow = -1;                  // índice de fila del tracklist en edición (o -1)
let TRACKLISTS = {};                 // tracklists incrustados (de tracklists.json)
let filter = localStorage.getItem(LS_FILTER) || 'all';  // all|new|progress|done
let currentIndex = -1;               // set seleccionado en la UI (o -1)
let loadedIndex = -1;                // set realmente cargado en el widget (o -1)
let playerState = 'stopped';         // 'playing' | 'paused' | 'stopped'
let widget = null;
let widgetReady = false;
let curPosMs = 0;                    // posición viva del set actual
let curDurMs = 0;                    // duración viva del set actual
let pendingSeekMs = null;            // seek a aplicar tras cargar un set (resume)
let forceSeekMs = null;              // seek explícito (marca/tracklist) al cargar un set
let lastSaveTs = 0;

// ============================================================
// PERSISTENCIA DE POSICIÓN POR SET
// ============================================================
function getPos(url){ return pos[url] || {pos:0, dur:0, done:false, at:null}; }

function savePos(url, p, d, done){
  if (!url) return;
  const prev = pos[url] || {};
  pos[url] = {
    pos: Math.max(0, Math.round(p||0)),
    dur: Math.round(d || prev.dur || 0),
    done: done !== undefined ? done : (prev.done || false),
    at: new Date().toISOString()
  };
  localStorage.setItem(LS_POS, JSON.stringify(pos));
}

function markDone(url, done){
  const p = getPos(url);
  savePos(url, done ? (p.dur || curDurMs) : p.pos, p.dur || curDurMs, done);
}

// ============================================================
// UTILIDADES
// ============================================================
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function hhmmss(ms){
  let s = Math.max(0, Math.floor((ms||0)/1000));
  const h = Math.floor(s/3600); s -= h*3600;
  const m = Math.floor(s/60);   s -= m*60;
  const mm = (h ? String(m).padStart(2,'0') : String(m));
  return (h ? h + ':' : '') + mm + ':' + String(s).padStart(2,'0');
}
function artUrl(u){
  if (!u) return null;
  return u.replace('-large.', '-t200x200.'); // mejor resolución cuando existe
}
function artHTML(u, cls){
  const a = artUrl(u);
  return a ? '<img src="'+esc(a)+'" loading="lazy" alt="">' : '';
}

// ============================================================
// RENDER DE LA LISTA
// ============================================================
// Estado de escucha de un set: 'new' | 'progress' | 'done'
function setStatus(url){
  const p = getPos(url);
  if (p.done) return 'done';
  if (p.pos > PROGRESS_MIN_MS) return 'progress';
  return 'new';
}
function passesFilter(s){
  return filter === 'all' || setStatus(s.url) === filter;
}

function render(){
  const list = document.getElementById('list');
  if (!SETS.length){
    list.innerHTML = '<div class="empty">No se encontraron sets en la playlist.</div>';
    updateSub();
    return;
  }
  // Filtrar preservando el índice global (playSet/updateCard usan el índice de SETS)
  const html = SETS.map((s, i) => passesFilter(s) ? cardHTML(s, i) : '').join('');
  if (!html){
    const label = {new:'nuevos', progress:'en proceso', done:'escuchados'}[filter] || '';
    list.innerHTML = '<div class="empty">No hay sets ' + label + '.</div>';
  } else {
    list.innerHTML = html;
    // Toda la tarjeta selecciona el set (no solo el botón de play)
    list.querySelectorAll('[data-card]').forEach(el => {
      el.addEventListener('click', () => playSet(parseInt(el.dataset.card,10)));
    });
  }
  updateSub();
}

function cardBadges(s){
  const nm = getMarks(s.url).length;
  const tl = getTracklist(s.url);
  const nt = tl ? tl.tracks.length : 0;
  if (!nm && !nt) return '';
  return '<div class="cbadges">' +
    (nm ? '<span>📍 ' + nm + (nm===1?' marca':' marcas') + '</span>' : '') +
    (nt ? '<span>🎵 ' + nt + ' tracks</span>' : '') +
  '</div>';
}

function cardHTML(s, i){
  const p = getPos(s.url);
  const dur = p.dur || s.dur || 0;
  const pct = dur ? Math.min(100, (p.pos/dur)*100) : 0;
  const isCur = i === currentIndex;
  const playing = isCur && playerState === 'playing';
  const started = p.pos > 3000 && !p.done;
  const timeLabel = p.done
    ? '<span class="done-tag">✓ escuchado</span>'
    : (started ? esc(hhmmss(p.pos)) + ' / ' + esc(hhmmss(dur))
               : esc(hhmmss(dur)));
  const rightLabel = p.done ? '' : (started ? Math.round(pct) + '%' : '');
  return `
    <div class="card ${isCur?'playing':''} ${p.done?'done':''}" data-card="${i}">
      <div class="art">${artHTML(s.art)}${s.art?'':'♪'}</div>
      <div class="cbody">
        <div class="ctitle">${esc(s.title)}</div>
        <div class="cartist">${esc(s.artist)}</div>
        <div class="cprog">
          <div class="cbar"><div class="cfill" style="width:${pct}%"></div></div>
          <div class="ctime"><span>${timeLabel}</span><span>${rightLabel}</span></div>
        </div>
        ${cardBadges(s)}
      </div>
      <button class="cplay ${isCur?'':'ghost'}" data-play="${i}" aria-label="Reproducir">${playing?IC_PAUSE:IC_PLAY}</button>
    </div>`;
}

// Actualiza la barra/tiempos de una sola card sin re-render completo
function updateCard(i){
  const card = document.querySelector('.card[data-card="'+i+'"]');
  if (!card) return;
  const s = SETS[i];
  const p = getPos(s.url);
  const dur = p.dur || s.dur || 0;
  const pct = dur ? Math.min(100, (p.pos/dur)*100) : 0;
  const fill = card.querySelector('.cfill');
  if (fill) fill.style.width = pct + '%';
  const times = card.querySelector('.ctime');
  if (times){
    const started = p.pos > 3000 && !p.done;
    times.children[0].innerHTML = p.done
      ? '<span class="done-tag">✓ escuchado</span>'
      : (started ? esc(hhmmss(p.pos)) + ' / ' + esc(hhmmss(dur)) : esc(hhmmss(dur)));
    times.children[1].textContent = p.done ? '' : (started ? Math.round(pct)+'%' : '');
  }
  card.classList.toggle('done', p.done);
  // Refrescar contadores de marcas/tracks
  const bwrap = card.querySelector('.cbadges');
  const html = cardBadges(s);
  if (html){
    if (bwrap) bwrap.outerHTML = html;
    else { const body = card.querySelector('.cbody'); if (body) body.insertAdjacentHTML('beforeend', html); }
  } else if (bwrap){ bwrap.remove(); }
}

function updateSub(){
  const c = {all: SETS.length, new:0, progress:0, done:0};
  SETS.forEach(s => { c[setStatus(s.url)]++; });
  const el = document.getElementById('sub');
  el.classList.remove('err');
  el.textContent = SETS.length ? (SETS.length + ' sets · ' + c.done + ' escuchados') : '';
  document.querySelectorAll('.chip .n').forEach(n => {
    const k = n.dataset.n;
    n.textContent = c[k] != null ? '·' + c[k] : '';
  });
  document.querySelectorAll('#filters .chip').forEach(ch =>
    ch.classList.toggle('active', ch.dataset.filter === filter));
}

// ============================================================
// REPRODUCTOR
// ============================================================
function unlockAudio(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC){
      window._ac = window._ac || new AC();
      if (window._ac.state === 'suspended') window._ac.resume();
    }
  }catch(e){}
}

function playSet(i){
  unlockAudio();
  if (i === loadedIndex){
    // El set ya está cargado en el widget: alternar play/pausa (gesto directo, ok en iOS)
    currentIndex = i;
    togglePlay();
    return;
  }
  // Guardar posición del set que estaba cargado antes de cambiar
  const prev = loadedIndex;
  flushSave();
  if (prev >= 0) updateCard(prev);

  currentIndex = i;
  loadedIndex = i;
  const s = SETS[i];
  const p = getPos(s.url);
  // Prioridad: salto explícito (marca/tracklist) > reanudar donde quedó > desde cero
  if (forceSeekMs != null){
    pendingSeekMs = forceSeekMs; forceSeekMs = null;
  } else {
    pendingSeekMs = (!p.done && p.pos > 1000) ? p.pos : 0;
  }
  curPosMs = pendingSeekMs;
  curDurMs = p.dur || s.dur || 0;

  localStorage.setItem(LS_LAST, s.url);
  setMediaSession(s);
  showPlayerFor(i);
  highlightCards();

  if (!widget){ return; }
  // Cargar el set como track individual (sin auto-avance de playlist).
  widget.load(s.url, {
    auto_play: false, show_artwork:false, show_comments:false, visual:false,
    buying:false, sharing:false, download:false, show_playcount:false,
    show_user:false, hide_related:true, show_teaser:false,
    callback: function(){
      widget.getDuration(function(d){
        if (d){ curDurMs = d; savePos(s.url, curPosMs, d); }
        renderTimes(curPosMs);
      });
      if (pendingSeekMs && pendingSeekMs > 1000){
        widget.seekTo(pendingSeekMs);
      }
      pendingSeekMs = null;
    }
  });
  // play() sincrónico dentro del gesto: preserva el permiso de autoplay de iOS.
  widget.play();
}

function togglePlay(){
  if (!widget) return;
  widget.isPaused(function(paused){ paused ? widget.play() : widget.pause(); });
}

// Botón play/pausa del reproductor: si el set seleccionado aún no está cargado
// (p.ej. recién restaurado al abrir la app), lo carga y reanuda; si ya está, alterna.
function onPlayPause(){
  if (currentIndex < 0) return;
  unlockAudio();
  if (loadedIndex === currentIndex) togglePlay();
  else playSet(currentIndex);
}

// Salto SOLO hacia adelante (sets largos): +1 / +3 / +20 min
function seekBy(seconds){
  if (!widget || currentIndex < 0) return;
  widget.getPosition(function(p){
    const dur = curDurMs || 0;
    let target = p + seconds*1000;
    if (dur) target = Math.min(target, dur - 1500);
    target = Math.max(0, target);
    // Pausar antes de saltar evita el glitch de buffer en iOS
    widget.pause();
    widget.seekTo(target);
    setTimeout(function(){ widget.play(); }, 120);
  });
}

function nextSet(){ if (currentIndex >= 0 && currentIndex < SETS.length-1) playSet(currentIndex+1); }
function prevSet(){ if (currentIndex > 0) playSet(currentIndex-1); }

function restartSet(){
  if (currentIndex < 0 || !widget) return;
  const s = SETS[currentIndex];
  savePos(s.url, 0, getPos(s.url).dur || curDurMs, false);
  updateCard(currentIndex);
  updateSub();
  if (loadedIndex === currentIndex){
    curPosMs = 0;
    widget.seekTo(0);
    widget.play();
    renderTimes(0);
  } else {
    playSet(currentIndex);   // carga y arranca desde 0 (pos ya está en 0)
  }
}

function toggleDoneCurrent(){
  if (currentIndex < 0) return;
  const s = SETS[currentIndex];
  const p = getPos(s.url);
  markDone(s.url, !p.done);
  if (filter !== 'all') render(); else updateCard(currentIndex);
  updateSub();
  updateFullMarkBtn();
  highlightCards();
}

// Saltar a un tiempo exacto del set seleccionado (marcas / tracklist).
// A diferencia de los saltos de sampleo, esto puede ir hacia atrás.
function jumpTo(ms){
  if (currentIndex < 0 || !widget) return;
  unlockAudio();
  ms = Math.max(0, ms);
  if (loadedIndex === currentIndex){
    widget.pause();
    widget.seekTo(ms);
    curPosMs = ms;
    renderTimes(ms);
    setTimeout(function(){ widget.play(); }, 100);
  } else {
    forceSeekMs = ms;      // cargar el set y arrancar en ese punto
    playSet(currentIndex);
  }
}

// ============================================================
// MARCAS MANUALES (comentario en un tiempo del set)
// ============================================================
function getMarks(url){ return marks[url] || []; }
function saveMarks(){ localStorage.setItem(LS_MARKS, JSON.stringify(marks)); }

function addMarkHere(){
  if (currentIndex < 0) return;
  const s = SETS[currentIndex];
  const t = Math.round(curPosMs || 0);
  const note = (window.prompt('Comentario para la marca en ' + hhmmss(t) + ':', '') || '').trim();
  if (!note) return;
  const arr = getMarks(s.url).slice();
  arr.push({t: t, note: note});
  arr.sort(function(a,b){ return a.t - b.t; });
  marks[s.url] = arr;
  saveMarks();
  renderTracklist();
  updateCard(currentIndex);
}

function delMark(idx){
  if (currentIndex < 0) return;
  const s = SETS[currentIndex];
  const arr = getMarks(s.url).slice();
  arr.splice(idx, 1);
  if (arr.length) marks[s.url] = arr; else delete marks[s.url];
  saveMarks();
  renderTracklist();
  updateCard(currentIndex);
}

// ============================================================
// TRACKLIST INCRUSTADO (de tracklists.json) + link de trackid por set
// ============================================================
function getTracklist(url){
  const l = LOCAL_TL[url];                                   // lo pegado en el dispositivo manda
  if (l && Array.isArray(l.tracks) && l.tracks.length) return l;
  const e = TRACKLISTS[url];
  return (e && Array.isArray(e.tracks)) ? e : null;
}
function hasLocalTL(url){ const l = LOCAL_TL[url]; return !!(l && Array.isArray(l.tracks) && l.tracks.length); }

// ---- Parser de tracklist pegada (tolerante a formatos) ----
function tlTimeToMs(s){
  const p = s.split(':').map(Number);
  const sec = p.length === 3 ? p[0]*3600 + p[1]*60 + p[2] : p[0]*60 + p[1];
  return sec * 1000;
}
function tlIsTime(s){ return /^\d{1,2}:\d{2}(?::\d{2})?$/.test(s); }
function tlExtractTime(line){
  const m = line.match(/\b(\d{1,2}:\d{2}(?::\d{2})?)\b/);
  if (!m) return { t:null, rest:line };
  const rest = (line.slice(0, m.index) + line.slice(m.index + m[0].length))
    .replace(/^[\s\-–—.\)\]\[|]+|[\s\-–—.\(\[\]|]+$/g, '').trim();
  return { t: tlTimeToMs(m[1]), rest };
}
function tlCleanName(s){ return s.replace(/^\s*\d{1,3}\s*[\.\)]\s+/, '').trim(); }
function tlSplitAT(name){
  const parts = name.split(/\s+[-–—]\s+/);
  if (parts.length >= 2) return { artist: parts[0].trim(), title: parts.slice(1).join(' - ').trim() };
  return { artist: '', title: name };
}
// ---- CSV (export de trackid.net) ----
function tlPickDelim(text){
  const first = (text.split(/\r?\n/).find(l => l.trim()) || '');
  const counts = { ',':0, ';':0, '\t':0 };
  for (const ch of first){ if (ch in counts) counts[ch]++; }
  let best = null, n = 0;
  for (const d in counts){ if (counts[d] > n){ n = counts[d]; best = d; } }
  return n > 0 ? best : null;
}
function tlParseCSVRows(text, delim){
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){
      if (c === '"'){ if (text[i+1] === '"'){ cur += '"'; i++; } else q = false; }
      else cur += c;
    } else {
      if (c === '"') q = true;
      else if (c === delim){ row.push(cur); cur = ''; }
      else if (c === '\n'){ row.push(cur); rows.push(row); row = []; cur = ''; }
      else if (c === '\r'){ /* ignora */ }
      else cur += c;
    }
  }
  if (cur.length || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(x => x && x.trim()));
}
// Devuelve [{t,artist,title,plays?,empty?}] si el texto es un CSV con encabezado reconocible; si no, null.
function parseTracklistCSV(text){
  const delim = tlPickDelim(text);
  if (!delim) return null;
  const rows = tlParseCSVRows(text, delim);
  if (rows.length < 2) return null;
  const header = rows[0].map(h => (h || '').trim().toLowerCase());
  const find = re => header.findIndex(h => re.test(h));
  const ci = {
    t:      find(/\b(time|timestamp|start|cue|position|when|offset)\b/),
    artist: find(/artist/),
    title:  find(/\b(title|track|song)\b/),
    plays:  find(/\b(play|plays|count|spins?|times|occurr)\b/)
  };
  if (ci.artist < 0 && ci.title < 0 && ci.t < 0) return null;   // no parece CSV de tracklist
  const cell = (row, k) => (ci[k] >= 0 && ci[k] < row.length) ? String(row[ci[k]]).trim() : '';
  const out = [];
  for (let r = 1; r < rows.length; r++){
    const row = rows[r];
    let t = null;
    const tRaw = cell(row, 't');
    if (tRaw){
      const m = tRaw.match(/\b\d{1,2}:\d{2}(?::\d{2})?\b/);
      if (m) t = tlTimeToMs(m[0]);
      else if (/^\d+(\.\d+)?$/.test(tRaw)) t = Math.round(parseFloat(tRaw) * 1000); // segundos
    }
    let artist = cell(row, 'artist');
    let title  = cell(row, 'title');
    if (!artist && title && /\s+[-–—]\s+/.test(title)){ const at = tlSplitAT(title); artist = at.artist; title = at.title; }
    const playsRaw = cell(row, 'plays');
    const plays = /^\d+$/.test(playsRaw) ? parseInt(playsRaw, 10) : undefined;
    const blank = !artist && (!title || /^(id|unknown|unreleased|\?+|n\/a|-{1,})$/i.test(title));
    if (blank){ if (t != null) out.push({ t, empty: true }); }
    else out.push(Object.assign({ t, artist, title }, plays != null ? { plays } : {}));
  }
  return out.length ? out : null;
}

// Convierte texto pegado en [{t,artist,title,...}]. Intenta CSV de trackid.net; si no, texto libre.
function parseTracklistText(text){
  const csv = parseTracklistCSV(text);
  const out = csv || parseTracklistLines(text);
  out.sort((a, b) => {
    if (a.t == null && b.t == null) return 0;
    if (a.t == null) return 1;
    if (b.t == null) return -1;
    return a.t - b.t;
  });
  return out;
}

// Texto libre: empareja tiempo y nombre estén en la misma línea o en líneas separadas.
function parseTracklistLines(text){
  const raw = (text || '').split(/\r?\n/).map(l => l.replace(/ /g, ' ').trim()).filter(Boolean);
  // Un token por línea: {t, name}. Si la línea trae tiempo y nombre, quedan amarrados.
  const toks = [];
  for (const line of raw){
    if (/^(tracklist|track\s*list|fuente|source|share|compartir|copy|copiar|edit|editar|playlist)\s*:?\s*$/i.test(line)) continue;
    const { t, rest } = tlExtractTime(line);
    const name = tlCleanName(rest);
    const hasName = name && /[a-z0-9]/i.test(name) && !tlIsTime(name);
    if (t == null && !hasName) continue;
    toks.push({ t: t, name: hasName ? name : null });
  }
  // Detectar la dirección dominante de emparejamiento entre nombre-suelto y tiempo-suelto,
  // para no robar el tiempo equivocado y para reconocer huecos "sin identificar".
  const isLoneTime = j => j >= 0 && j < toks.length && toks[j].name == null && toks[j].t != null;
  const isLoneName = j => j >= 0 && j < toks.length && toks[j].name != null && toks[j].t == null;
  let R = 0, L = 0;
  for (let i = 0; i < toks.length; i++){
    if (!isLoneName(i)) continue;
    if (isLoneTime(i+1)) R++;
    if (isLoneTime(i-1)) L++;
  }
  const dir = L > R ? -1 : 1;   // -1: el tiempo va antes del nombre; +1: después (por defecto)

  const usedTime = new Array(toks.length).fill(false);
  const out = [];
  for (let i = 0; i < toks.length; i++){
    const tk = toks[i];
    if (tk.name != null){
      let t = tk.t;
      if (t == null){                                // nombre suelto: toma el tiempo vecino en la dirección dominante
        if (isLoneTime(i+dir) && !usedTime[i+dir]){ t = toks[i+dir].t; usedTime[i+dir] = true; }
        else if (isLoneTime(i-dir) && !usedTime[i-dir]){ t = toks[i-dir].t; usedTime[i-dir] = true; }
      }
      const at = tlSplitAT(tk.name);
      out.push({ t, artist: at.artist, title: at.title });
    }
  }
  // Los tiempos sueltos que nadie tomó son huecos que Track ID no identificó.
  for (let i = 0; i < toks.length; i++){
    if (toks[i].name == null && toks[i].t != null && !usedTime[i]){
      out.push({ t: toks[i].t, artist: '', title: '', empty: true });
    }
  }
  // Ordenar por tiempo (deja al final los sin tiempo).
  out.sort((a, b) => {
    if (a.t == null && b.t == null) return 0;
    if (a.t == null) return 1;
    if (b.t == null) return -1;
    return a.t - b.t;
  });
  return out;
}

function trackKey(tr, i){ return (tr.t != null && tr.t !== '') ? ('t' + tr.t) : ('i' + i); }
function getTrackNote(url, key){ const m = TLNOTES[url]; return (m && m[key]) ? m[key] : null; }
function setTrackNote(url, key, artist, title){
  if (!TLNOTES[url]) TLNOTES[url] = {};

  else TLNOTES[url][key] = { artist, title };

  saveTLNotes();
}

// Aplica las notas manuales sobre una lista de tracks (para render y export)
function applyNotes(url, tracks){
  return tracks.map((tr, i) => {
    const ov = getTrackNote(url, trackKey(tr, i));
    if (!ov) return tr;
    return { t: tr.t, artist: ov.artist, title: ov.title, plays: tr.plays, noted: true };
  });
}
// Descarga un tracklists.json con lo incrustado + lo pegado + notas (para actualizar el repo)
function exportTracklists(){
  const merged = Object.assign({}, TRACKLISTS);
  Object.keys(LOCAL_TL).forEach(u => { if (hasLocalTL(u)) merged[u] = { source: LOCAL_TL[u].source || '', tracks: applyNotes(u, LOCAL_TL[u].tracks) }; });
  const blob = new Blob([JSON.stringify(merged, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'tracklists.json';
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

function renderTracklist(){
  const body = document.getElementById('tlBody');
  const count = document.getElementById('tlCount');
  if (!body || currentIndex < 0){ if (body) body.innerHTML = ''; if (count) count.textContent=''; return; }
  const s = SETS[currentIndex];
  const tl = getTracklist(s.url);
  const dur = getPos(s.url).dur || s.dur || curDurMs || 0;
  const marksArr = getMarks(s.url);
  const saved = tidUrls[s.url] || '';

  // Caja para pegar tracks (link de trackid como atajo para abrir/copiar + textarea + parser)
  function pasteBox(hidden){
    const openLink = saved
      ? '<a class="tid-open" href="' + esc(saved) + '" target="_blank" rel="noopener">Abrir en trackid.net ↗</a>'
      : '';
    return '<div class="tl-paste" id="tlPasteWrap"' + (hidden ? ' style="display:none"' : '') + '>' +
      '<div class="tid-form">' +
        '<input id="tidInput" type="url" inputmode="url" placeholder="Link de trackid.net (opcional)" value="' + esc(saved) + '">' +
        '<button id="tidSave">Guardar link</button>' +
      '</div>' + openLink +
      '<textarea id="tlPaste" placeholder="Pega aquí la tracklist (ej.: 0:00 Artista - Título, una por línea)"></textarea>' +
      '<div class="tl-actions">' +
        '<button id="tlAdd">Agregar tracks</button>' +
        '<button id="tlClear" class="ghost">Limpiar</button>' +
      '</div>' +
      '<div class="tl-err" id="tlErr"></div>' +
      '<div class="tl-hint">Abre el link, copia la tracklist en trackid.net, pégala aquí y toca “Agregar tracks”. Se guarda en este dispositivo.</div>' +
    '</div>';
  }

  // Helpers de fila
  function playsHTML(tr){
    const pv = (typeof tr.plays === 'number' && isFinite(tr.plays)) ? tr.plays
             : (/^\d+$/.test(String(tr.plays == null ? '' : tr.plays)) ? parseInt(tr.plays, 10) : null);
    return (pv != null)
      ? '<span class="tk-plays" title="reproducciones">▷ ' + esc(pv.toLocaleString('es-CL')) + '</span>' : '';
  }
  function noteEditor(tr, i, ov){
    return '<div class="tk-note">' +
        '<input id="tnA" placeholder="Artista" value="' + esc(ov ? ov.artist : tr.artist || '') + '">' +
        '<input id="tnT" placeholder="Título" value="' + esc(ov ? ov.title : tr.title || '') + '">' +
        '<button data-notesave="' + i + '">Guardar</button>' +
        (ov ? '<button class="ghost" data-notedel="' + i + '">Quitar</button>' : '') +
      '</div>';
  }
  function rangeLabel(t, end){
    const start = hhmmss(t);
    return end != null ? start + '<span class="end"> –' + hhmmss(end) + '</span>' : start;
  }

  const hasTL = !!(tl && tl.tracks.length);
  const nT = hasTL ? tl.tracks.length : 0;

  count.textContent = (nT ? nT + ' tracks' : '') +
    (nT && marksArr.length ? ' · ' : '') +
    (marksArr.length ? marksArr.length + (marksArr.length === 1 ? ' marca' : ' marcas') : '');

  // ---- Construir la línea de tiempo unificada ----
  // Tracks con tiempo llevan inicio–fin (fin = inicio del siguiente; el último, la duración del set).
  const timed = [], untimed = [];
  if (hasTL){
    tl.tracks.forEach((tr, i) => {
      if (tr.t != null && tr.t !== '') timed.push({ tr, i, t: tr.t });
      else untimed.push({ tr, i });
    });
    timed.sort((a, b) => a.t - b.t);
    timed.forEach((it, k) => {
      it.end = (k + 1 < timed.length) ? timed[k + 1].t : (dur && dur > it.t ? dur : null);
    });
  }

  const items = [];
  const INTRO_MIN = 45000;   // intro sin identificar si el primer track parte pasado :45
  if (timed.length && timed[0].t >= INTRO_MIN){
    items.push({ kind: 'intro', t: 0, end: timed[0].t });
  }
  timed.forEach(it => items.push({ kind: 'track', t: it.t, end: it.end, tr: it.tr, i: it.i }));
  marksArr.forEach((m, mi) => items.push({ kind: 'mark', t: m.t, note: m.note, mi: mi }));
  // Ordenar por tiempo; a igual tiempo, el track/bloque va antes que la marca.
  items.sort((a, b) => (a.t - b.t) || ((a.kind === 'mark' ? 1 : 0) - (b.kind === 'mark' ? 1 : 0)));

  function trackRow(it){
    const tr = it.tr, i = it.i, key = trackKey(tr, i);
    const ov = getTrackNote(s.url, key);
    const editor = (tlEditRow === i) ? noteEditor(tr, i, ov) : '';
    // Bloque sin identificar (Track ID no lo reconoció y no tiene nota): fila atenuada, con ✎ para nombrarlo.
    if (!ov && tr.empty){
      return '<div class="gapline" data-jump="' + tr.t + '">' +
        '<span class="g-t">' + rangeLabel(tr.t, it.end) + '</span>' +
        '<span class="g-lbl"><span class="dot"></span>sin identificar' +
          (it.end != null ? ' · ' + hhmmss(it.end - tr.t) : '') + '</span>' +
        '<button class="tk-edit" data-editrow="' + i + '" aria-label="Nombrar">✎</button>' +
      '</div>' + editor;
    }
    let cls = 'tk', label;
    if (ov){ cls += ' tk-user'; label = [ov.artist, ov.title].filter(Boolean).map(esc).join(' — '); }
    else { label = [tr.artist, tr.title].filter(Boolean).map(esc).join(' — ') || 'ID'; }
    const dl = (it.end != null) ? '<span class="tk-dur">' + hhmmss(it.end - tr.t) + '</span>' : '';
    return '<div class="' + cls + '" data-jump="' + tr.t + '">' +
      '<div class="tk-left"><span class="tk-t">' + rangeLabel(tr.t, it.end) + '</span>' + attrHTML(s.url, key) + '</div>' +
      '<span class="tk-name">' + label + dl + playsHTML(tr) + '</span>' +
      tagBtn(i, s.url, key) +
      '<button class="tk-edit" data-editrow="' + i + '" aria-label="Nota">✎</button>' +
    '</div>' + editor;
  }
  function introRow(it){
    return '<div class="gapline" data-jump="0">' +
      '<span class="g-t">' + rangeLabel(0, it.end) + '</span>' +
      '<span class="g-lbl"><span class="dot"></span>sin identificar · intro</span>' +
    '</div>';
  }
  function markRow(it){
    return '<div class="mk-inline" data-jump="' + it.t + '">' +
      '<span class="mk-time">' + esc(hhmmss(it.t)) + '</span>' +
      '<span class="mk-note"><span class="mk-pin">📍</span>' + esc(it.note) + '</span>' +
      '<button class="mk-x" data-delmark="' + it.mi + '" aria-label="Borrar marca">✕</button>' +
    '</div>';
  }
  function untimedRow(u){
    const tr = u.tr, i = u.i, key = trackKey(tr, i), ov = getTrackNote(s.url, key);
    const editor = (tlEditRow === i) ? noteEditor(tr, i, ov) : '';
    let cls = 'tk', label;
    if (ov){ cls += ' tk-user'; label = [ov.artist, ov.title].filter(Boolean).map(esc).join(' — '); }
    else if (tr.empty){ cls += ' tk-empty'; label = 'sin identificar'; }
    else { label = [tr.artist, tr.title].filter(Boolean).map(esc).join(' — ') || 'ID'; }
    return '<div class="' + cls + '">' +
      '<div class="tk-left"><span class="tk-t">—</span>' + attrHTML(s.url, key) + '</div>' +
      '<span class="tk-name">' + label + playsHTML(tr) + '</span>' +
      tagBtn(i, s.url, key) +
      '<button class="tk-edit" data-editrow="' + i + '" aria-label="Nota">✎</button>' +
    '</div>' + editor;
  }

  // Nada aún: mensaje + caja de pegado
  if (!items.length && !untimed.length){
    body.innerHTML =
      '<div class="sect-empty">Aún no hay tracklist ni marcas para este set. Toca ＋ Marca aquí para guardar un comentario en el minuto actual, o pega la lista desde trackid.net.</div>' +
      pasteBox(false) +
      '<div class="tl-foot"><button id="tlExport">Exportar JSON</button></div>';
    return;
  }

  const src = (hasTL && tl.source)
    ? '<div class="tl-src">Fuente: <a href="' + esc(tl.source) + '" target="_blank" rel="noopener">' + esc(tl.source) + '</a></div>'
    : '';
  let html = src;
  items.forEach(it => {
    if (it.kind === 'intro') html += introRow(it);
    else if (it.kind === 'track') html += trackRow(it);
    else if (it.kind === 'mark') html += markRow(it);
  });
  untimed.forEach(u => { html += untimedRow(u); });

  const local = hasLocalTL(s.url);
  const foot = '<div class="tl-foot">' +
    '<button id="tlEdit">' + (local ? 'Reemplazar tracks' : 'Pegar tracks') + '</button>' +
    (local ? '<button id="tlDel" class="danger">Borrar tracks</button>' : '') +
    '<button id="tlExport">Exportar JSON</button>' +
    '<button id="tlExportTags">Exportar tags</button>' +
  '</div>';
  body.innerHTML = html + foot + pasteBox(true);
}

// ============================================================
// EVENTOS DEL WIDGET
// ============================================================
function bindWidget(){
  const E = SC.Widget.Events;
  widget.bind(E.PLAY, function(){
    playerState = 'playing';
    widget.getDuration(function(d){ if (d) curDurMs = d; });
    if (filter !== 'all') render();   // un set nuevo pasa a "en proceso": refrescar el filtro
    syncPlayIcons();
    highlightCards();
  });
  widget.bind(E.PAUSE, function(){
    playerState = 'paused';
    flushSave();
    syncPlayIcons();
    highlightCards();
  });
  widget.bind(E.PLAY_PROGRESS, function(e){
    const cp = (e && e.currentPosition) ? e.currentPosition : 0;
    // Aplicar resume si quedó pendiente (respaldo por si el callback no alcanzó)
    if (pendingSeekMs && pendingSeekMs > 1000 && cp < pendingSeekMs - 4000){
      const t = pendingSeekMs; pendingSeekMs = null; widget.seekTo(t); return;
    }
    curPosMs = cp;
    renderTimes(cp);
    maybeSave();
  });
  widget.bind(E.FINISH, function(){
    if (loadedIndex < 0) return;
    const s = SETS[loadedIndex];
    savePos(s.url, curDurMs, curDurMs, true);
    playerState = 'paused';
    widget.pause();               // corta el auto-avance de la playlist
    syncPlayIcons();
    if (filter !== 'all') render(); else updateCard(loadedIndex);
    updateFullMarkBtn();
    updateSub();
  });
}

function maybeSave(){
  const now = Date.now();
  if (now - lastSaveTs < SAVE_EVERY_MS) { liveUI(); return; }
  lastSaveTs = now;
  flushSave();
  liveUI();
}
function flushSave(){
  if (loadedIndex < 0) return;
  const s = SETS[loadedIndex];
  const dur = curDurMs || getPos(s.url).dur || 0;
  const done = dur ? (curPosMs >= dur * DONE_RATIO) : false;
  savePos(s.url, curPosMs, dur, done || getPos(s.url).done);
}
function liveUI(){
  if (loadedIndex >= 0) updateCard(loadedIndex);
}

function setMediaSession(s){
  if (!('mediaSession' in navigator)) return;
  try{
    navigator.mediaSession.metadata = new MediaMetadata({
      title: s.title, artist: s.artist, album: 'app_list'
    });
    navigator.mediaSession.setActionHandler('play',  () => widget && widget.play());
    navigator.mediaSession.setActionHandler('pause', () => widget && widget.pause());
    navigator.mediaSession.setActionHandler('nexttrack', () => nextSet());
    navigator.mediaSession.setActionHandler('previoustrack', () => prevSet());
    navigator.mediaSession.setActionHandler('seekforward', () => seekBy(60));
  }catch(e){}
}

// ============================================================
// ATRIBUTOS POR TRACK (estrellas + tags) — por ocurrencia (set + track)
// ============================================================
function saveTrackAttrs(){ localStorage.setItem(LS_TRACKATTRS, JSON.stringify(TRACKATTRS)); }
function getAttrRec(url, key){ const m = TRACKATTRS[url]; return (m && m[key]) ? m[key] : null; }
function attrHasAny(r){ return !!(r && (r.stars || r.gen || r.niv || r.atr)); }
function setAttrField(url, key, field, value, meta){
  if (!TRACKATTRS[url]) TRACKATTRS[url] = {};
  const rec = TRACKATTRS[url][key] || {};
  if (value === '' || value == null || value === 0) delete rec[field];
  else rec[field] = value;
  if (meta){ rec.artist = meta.artist || rec.artist || ''; rec.title = meta.title || rec.title || ''; if (meta.t != null) rec.t = meta.t; }
  rec.at = new Date().toISOString();
  const hasData = rec.stars || rec.gen || rec.niv || rec.atr;   // solo persistir si hay un atributo real
  if (!hasData) delete TRACKATTRS[url][key]; else TRACKATTRS[url][key] = rec;
  if (TRACKATTRS[url] && !Object.keys(TRACKATTRS[url]).length) delete TRACKATTRS[url];
  saveTrackAttrs();
}
function starsHTML(n){ n = n || 0; let s = ''; for (let k = 1; k <= 5; k++) s += (k <= n ? '★' : '☆'); return s; }
function attrHTML(url, key){
  const r = getAttrRec(url, key);
  if (!attrHasAny(r)) return '';
  let h = '<div class="tk-tags">';
  if (r.stars) h += '<span class="tk-stars">' + starsHTML(r.stars) + '</span>';
  if (r.gen) h += '<span class="tk-chip">' + esc(r.gen) + '</span>';
  if (r.niv) h += '<span class="tk-chip">' + esc(r.niv) + '</span>';
  if (r.atr) h += '<span class="tk-chip atr">' + esc(r.atr) + '</span>';
  return h + '</div>';
}
function tagBtn(i, url, key){
  const on = attrHasAny(getAttrRec(url, key));
  return '<button class="tk-tag' + (on ? ' on' : '') + '" data-tagrow="' + i + '" aria-label="Tags del track">🏷</button>';
}
function exportTrackAttrs(){
  const rows = [];
  Object.keys(TRACKATTRS).forEach(url => { const m = TRACKATTRS[url]; Object.keys(m).forEach(key => {
    const r = m[key];
    rows.push({ set: url, key: key, t: (r.t != null ? r.t : null), artist: r.artist || '', title: r.title || '',
                stars: r.stars || '', gen: r.gen || '', niv: r.niv || '', atr: r.atr || '', at: r.at || '' });
  }); });
  const blob = new Blob([JSON.stringify(rows, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'sets_track_tags.json';
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

// ---- Modal de tags (estilo "Select My Tags": una opción por categoría) ----
function openTagModal(i){
  if (currentIndex < 0) return;
  const s = SETS[currentIndex];
  const tl = getTracklist(s.url); if (!tl || !tl.tracks[i]) return;
  const tr = tl.tracks[i];
  tagModalCtx = { url: s.url, key: trackKey(tr, i), tr: tr, i: i };
  renderTagModal();
  document.getElementById('tagModal').classList.add('open');
}
function closeTagModal(){
  document.getElementById('tagModal').classList.remove('open');
  tagModalCtx = null;
  if (currentIndex >= 0){ renderTracklist(); updateCard(currentIndex); }
}
function tagModalMeta(){
  const tr = tagModalCtx.tr, ov = getTrackNote(tagModalCtx.url, tagModalCtx.key);
  return { artist: ov ? ov.artist : (tr.artist || ''), title: ov ? ov.title : (tr.title || ''), t: (tr.t != null ? tr.t : null) };
}
function tagTrackLabel(){
  const tr = tagModalCtx.tr, ov = getTrackNote(tagModalCtx.url, tagModalCtx.key);
  const a = ov ? ov.artist : tr.artist, t = ov ? ov.title : tr.title;
  const nm = [a, t].filter(Boolean).join(' — ') || (tr.empty ? 'sin identificar' : 'ID');
  const tm = (tr.t != null && tr.t !== '') ? hhmmss(tr.t) + ' · ' : '';
  return tm + nm;
}
function renderTagModal(){
  const body = document.getElementById('tagModalBody');
  if (!body || !tagModalCtx) return;
  const rec = getAttrRec(tagModalCtx.url, tagModalCtx.key) || {};
  let h = '<div class="tm-track">' + esc(tagTrackLabel()) + '</div>';
  h += '<div class="tm-sect">Estrellas</div><div class="tm-stars">';
  for (let k = 1; k <= 5; k++) h += '<span class="tm-star' + ((rec.stars || 0) >= k ? ' on' : '') + '" data-star="' + k + '">' + ((rec.stars || 0) >= k ? '★' : '☆') + '</span>';
  h += '</div>';
  (TAGVOCAB.categories || []).forEach(cat => {
    h += '<div class="tm-sect">' + esc(cat.label) + '</div>';
    let lastSuffix = null;
    (cat.values || []).forEach(v => {
      const suf = (cat.id === 'gen' && v.indexOf('*') > 0) ? v.split('*')[1] : null;
      if (suf && lastSuffix !== null && suf !== lastSuffix) h += '<div class="tm-div"></div>';
      lastSuffix = suf;
      const on = rec[cat.id] === v;
      h += '<div class="tm-opt' + (on ? ' on' : '') + '" data-cat="' + esc(cat.id) + '" data-val="' + esc(v) + '">' +
        '<span class="tm-radio"></span><span class="tm-lbl">' + esc(v) + '</span>' +
      '</div>';
    });
  });
  body.innerHTML = h;
}
function loadTags(){
  const apply = (data) => { if (data && Array.isArray(data.categories)) TAGVOCAB = data; };
  fetch(TAGS_URL).then(r => { if (!r.ok) throw new Error('no local'); return r.json(); }).then(apply)
    .catch(() => fetch(TAGS_URL_FALLBACK).then(r => r.json()).then(apply).catch(() => {}));
}

document.getElementById('tlBody').addEventListener('click', e => {
  const tg = e.target.closest('[data-tagrow]');

  const er = e.target.closest('[data-editrow]');
  if (er){ const i = parseInt(er.dataset.editrow,10); tlEditRow = (tlEditRow === i) ? -1 : i; renderTracklist(); return; }
  const ns = e.target.closest('[data-notesave]');
  if (ns){
    const s = SETS[currentIndex]; const tl = getTracklist(s.url);
    const i = parseInt(ns.dataset.notesave,10); const tr = tl.tracks[i];
    const a = document.getElementById('tnA'), t = document.getElementById('tnT');
    setTrackNote(s.url, trackKey(tr, i), a ? a.value : '', t ? t.value : '');
    tlEditRow = -1; updateCard(currentIndex); renderTracklist(); return;
  }
  const nd = e.target.closest('[data-notedel]');
  if (nd){
    const s = SETS[currentIndex]; const tl = getTracklist(s.url);
    const i = parseInt(nd.dataset.notedel,10); const tr = tl.tracks[i];
    setTrackNote(s.url, trackKey(tr, i), '', '');
    tlEditRow = -1; updateCard(currentIndex); renderTracklist(); return;
  }
  const dm = e.target.closest('[data-delmark]');
  if (dm){ delMark(parseInt(dm.dataset.delmark,10)); return; }
  if (e.target.closest('#tidSave')){ saveTid(); return; }
  if (e.target.closest('#tlAdd')){ addPastedTracklist(); return; }
  if (e.target.closest('#tlClear')){ const t = document.getElementById('tlPaste'); if (t){ t.value=''; t.focus(); } const err = document.getElementById('tlErr'); if (err) err.textContent=''; return; }
  if (e.target.closest('#tlDel')){ deleteLocalTL(); return; }
  if (e.target.closest('#tlExport')){ exportTracklists(); return; }
  if (e.target.closest('#tlExportTags')){ exportTrackAttrs(); return; }
  if (e.target.closest('#tlEdit')){ const w = document.getElementById('tlPasteWrap'); if (w){ w.style.display = (w.style.display==='none'?'':'none'); if (w.style.display!=='none'){ const t=document.getElementById('tlPaste'); if (t) t.focus(); } } return; }
  // Tocar cualquier parte de una fila con tiempo (track, bloque o marca) carga/salta a ese punto
  const j = e.target.closest('[data-jump]');
  if (j && j.dataset.jump !== ''){ jumpTo(parseInt(j.dataset.jump,10)); return; }
});

// ============================================================
// INIT
// ============================================================
function fail(msg){
  document.getElementById('list').innerHTML =
    '<div class="empty">No se pudo cargar la playlist.<br>' + esc(msg) + '</div>';
  const sub = document.getElementById('sub'); sub.classList.add('err'); sub.textContent = 'error';
}

function widgetUrl(url){
  return 'https://w.soundcloud.com/player/?url=' + encodeURIComponent(url) +
    '&auto_play=false&show_artwork=false&visual=false&hide_related=true' +
    '&show_comments=false&show_user=false&show_teaser=false&buying=false&sharing=false';
}

function loadPlaylist(){
  try { if (widget) widget.pause(); } catch(e){}
  SETS = []; currentIndex = -1; loadedIndex = -1; playerState = 'stopped';
  widgetReady = false; curPosMs = 0; curDurMs = 0;
  const plEl = document.getElementById('player'); if (plEl) plEl.classList.remove('open');
  const listEl = document.getElementById('list'); if (listEl) listEl.innerHTML = '<div class="empty">Cargando…</div>';
  const iframe = document.getElementById('scw');
  iframe.src = widgetUrl(PLAYLIST_URL);
  widget = SC.Widget(iframe);

  let loaded = false;
  const guard = setTimeout(() => { if (!loaded) fail('La playlist tardó demasiado o es privada. Ábrela con conexión a SoundCloud.'); }, 20000);

  widget.bind(SC.Widget.Events.READY, function(){
    widgetReady = true;
    widget.getSounds(function(sounds){
      loaded = true; clearTimeout(guard);
      // El widget de SoundCloud solo entrega metadata completa de los primeros ~5 sonidos
      // de la playlist; del resto devuelve stubs (id pero sin permalink_url). Los
      // "despertamos" recorriéndolos con skip() en silencio para que los sets recién
      // agregados a la playlist también aparezcan en la lista.
      const buildSets = function(list){
        SETS = (list || []).map(s => ({
          url: s.permalink_url,
          title: s.title || 'Set sin título',
          artist: (s.user && s.user.username) || '',
          dur: s.duration || 0,
          art: s.artwork_url || (s.user && s.user.avatar_url) || null
        })).filter(s => s.url);
        bindWidget();
        render();
        syncHeaderHeight();
        restoreLast();
        loadTracklists();
        loadTags();
      };
      const missing = [];
      (sounds || []).forEach((s, i) => { if (!(s && s.permalink_url)) missing.push(i); });
      if (!missing.length){ buildSets(sounds); return; }
      widget.setVolume(0);
      let k = 0;
      (function step(){
        if (k >= missing.length){
          widget.skip(0); widget.pause(); widget.setVolume(100);
          widget.getSounds(buildSets);
          return;
        }
        widget.skip(missing[k]); widget.pause(); k++;
        setTimeout(step, 500);
      })();
    });
  });
  widget.bind(SC.Widget.Events.ERROR, function(){
    fail('SoundCloud devolvió un error al abrir la playlist.');
  });
}

function boot(){
  if (!window.SC || !window.SC.Widget){ setTimeout(boot, 200); return; }
  const sel = document.getElementById('selPlaylist');
  if (sel){
    sel.innerHTML = PLAYLISTS.map(p => '<option value="' + esc(p.url) + '">' + esc(p.name) + '</option>').join('');
    sel.value = PLAYLIST_URL;
    sel.addEventListener('change', function(){
      PLAYLIST_URL = sel.value;
      try { localStorage.setItem(LS_PL, PLAYLIST_URL); } catch(e){}
      loadPlaylist();
    });
  }
  loadPlaylist();
}

// Carga opcional de tracklists incrustados (no bloquea la app si no existe)
function loadTracklists(){
  const apply = (data) => {
    if (data && typeof data === 'object' && !Array.isArray(data)){
      TRACKLISTS = data;
      SETS.forEach((s, i) => updateCard(i));
      if (currentIndex >= 0) renderTracklist();
    }
  };
  fetch(TRACKLISTS_URL)
    .then(r => { if (!r.ok) throw new Error('no local'); return r.json(); })
    .then(apply)
    .catch(() => fetch(TRACKLISTS_URL_FALLBACK).then(r => r.json()).then(apply).catch(() => {}));
}

// Al abrir, deja el último set escuchado listo en el mini-reproductor (en pausa)
function restoreLast(){
  const last = localStorage.getItem(LS_LAST);
  if (!last) return;
  const i = SETS.findIndex(s => s.url === last);
  if (i < 0) return;
  currentIndex = i;
  const p = getPos(SETS[i].url);
  curPosMs = p.done ? 0 : p.pos;
  curDurMs = p.dur || SETS[i].dur || 0;
  playerState = 'paused';
  showPlayerFor(i);
  highlightCards();
}

boot();
